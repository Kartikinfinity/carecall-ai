# Render Blueprint: New > Blueprint > pick this repo. Secrets (sync: false) are typed into the Render dashboard.
services:
  - type: web
    name: carecall-ai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: GNANI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: GNANI_STT_MODEL
        value: prisma-v3.0
      - key: GNANI_STT_LANGS
        value: hi-IN,en-IN
      - key: GNANI_TTS_MODEL
        value: timbre-v2.5
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.6-flash
      - key: DAILY_GNANI_CAP
        value: "300"
      - key: RESEED_ON_BOOT
        value: "1"
