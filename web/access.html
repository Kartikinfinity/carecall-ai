<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareCall AI — Access</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23005eb8'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">✚</span>
      <div>
        <div class="brand-name">CareCall AI</div>
        <div class="brand-sub">Multilingual clinic receptionist · <span class="tag tag-warn">Synthetic demo</span></div>
      </div>
    </div>
  </header>
  <main class="layout" style="grid-template-columns: minmax(0, 520px); justify-content: center;">
    <form id="form" class="panel">
      <h1>Enter the demo access code</h1>
      <p class="lead">This live demo uses real Gnani speech APIs, so it is protected by a code shared with evaluators.</p>
      <label class="field">
        <span class="label">Access code</span>
        <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      </label>
      <button class="btn btn-primary btn-xl" type="submit">Open CareCall AI</button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>
  </main>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("error");
      err.hidden = true;
      const res = await fetch("/api/access", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: document.getElementById("code").value }) });
      if (res.ok) {
        const next = new URLSearchParams(location.search).get("next") || "/";
        location.href = next.startsWith("/") && !next.startsWith("//") ? next : "/";
      } else {
        err.textContent = (await res.json().catch(() => ({}))).detail || "Could not check the code.";
        err.hidden = false;
      }
    });
  </script>
</body>
</html>
